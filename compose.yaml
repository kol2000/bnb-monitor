name: bnb-monitor
x-common: &common
  image: bnb-monitor:1.1.0
  build: .
  env_file: .env
  volumes:
    - monitor-data:/data
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"
services:
  web:
    <<: *common
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *common
    command: ["python", "worker.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/data/heartbeat')<180"]
      interval: 60s
      timeout: 5s
      retries: 3
volumes:
  monitor-data:
